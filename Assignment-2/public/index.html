<!-- Add a role field (admin, user). Protect /admin route → only admins can access. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Role Based Auth</title>

  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="container">

    <!-- Signup Box -->
    <div class="form-box">

      <h2>Create Account</h2>

      <form id="signupForm">

        <input
          type="text"
          id="name"
          placeholder="Enter Name"
          required
        />

        <input
          type="email"
          id="email"
          placeholder="Enter Email"
          required
        />

        <!-- Password -->
        <div class="password-box">

          <input
            type="password"
            id="password"
            placeholder="Enter Password"
            required
          />

          <span id="togglePassword" class="eye-btn">
            👁️
          </span>

        </div>

        <!-- Role -->
        <select id="role">

          <option value="user">
            User
          </option>

          <option value="admin">
            Admin
          </option>

        </select>

        <button type="submit">
          Signup
        </button>

      </form>

      <p id="message"></p>

    </div>

    <!-- Admin Access -->
    <div class="form-box">

      <h2>Admin Panel</h2>

      <form id="adminForm">

        <input
          type="email"
          id="adminEmail"
          placeholder="Enter Admin Email"
          required
        />

        <button type="submit">
          Access Admin Route
        </button>

      </form>

      <p id="adminMessage"></p>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
